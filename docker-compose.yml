services:
  sofia-brain:
    build: .
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      easypanel-biex:
        aliases:
          - sofia-brain
          - brain-api
      biex_supabase_default:
        aliases:
          - supabase-db
    restart: unless-stopped

networks:
  easypanel-biex:
    external: true
  biex_supabase_default:
    external: true
